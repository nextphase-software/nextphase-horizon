# SPDX-License-Identifier: AGPL-3.0-only
[workspace]
members = ["packages/engine", "packages/app", "packages/cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
schemars = "=1.2.3"
num-bigint = "=0.5.1"
num-traits = "=0.2.19"
sha2 = "=0.11.1"
jsonschema = { version = "=0.58.6", default-features = false }
